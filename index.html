<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-TAKZIR</title>
    <style>
      :root {
        --bg: #06090d; --bg2: #0a0f15; --surface: #101821;
        --border: rgba(166, 183, 204, 0.14);
        --text: #edf5fb; --text2: #afbdca; --text3: #728397;
        --primary: #2dd4aa; --accent: #60a5fa; --ink: #04130d;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #eef4f8; --bg2: #f8fbfd; --surface: #ffffff;
          --border: rgba(15, 23, 42, 0.1);
          --text: #0f1729; --text2: #405166; --text3: #6f8195;
          --primary: #0d9488; --accent: #2563eb; --ink: #ffffff;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; min-height: 100vh; padding: 24px; color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: var(--bg);
        background-image: radial-gradient(120% 80% at 50% -10%,
          rgba(45, 212, 170, 0.16), transparent 60%);
        display: grid; place-items: center; -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%; max-width: 560px; padding: 40px; border-radius: 18px;
        background: linear-gradient(180deg, var(--surface), var(--bg2));
        border: 1px solid var(--border);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2),
          0 24px 60px -30px rgba(0, 0, 0, 0.6);
      }
      .brand { display: flex; align-items: center; gap: 10px;
        font-weight: 600; font-size: 14px; color: var(--text2); }
      .logo { width: 26px; height: 26px; border-radius: 8px; color: #04130d;
        background: linear-gradient(135deg, #2dd4aa, #0d9488);
        display: grid; place-items: center; font-weight: 800; font-size: 15px; }
      .badge { display: inline-flex; align-items: center; gap: 7px;
        margin-top: 26px; padding: 5px 11px; border-radius: 999px;
        font-size: 12px; font-weight: 600; color: var(--primary);
        background: color-mix(in srgb, var(--primary) 12%, transparent);
        border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent); }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent); }
      h1 { margin: 18px 0 8px; font-size: 30px; letter-spacing: -0.02em;
        line-height: 1.15; }
      p { margin: 0; color: var(--text2); font-size: 15px; line-height: 1.6; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.9em; padding: 2px 6px; border-radius: 6px; color: var(--text);
        background: color-mix(in srgb, var(--text3) 18%, transparent); }
      .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
      .btn { display: inline-flex; align-items: center; gap: 7px;
        padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 500;
        text-decoration: none; color: var(--text); border: 1px solid var(--border);
        transition: filter 0.15s ease; }
      .btn.primary { background: var(--primary); color: var(--ink);
        border-color: transparent; }
      .btn:hover { filter: brightness(1.06); }
      .hint { margin-top: 22px; font-size: 12.5px; color: var(--text3); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand"><span class="logo">K</span> EnvKit</div>
      <div class="badge"><span class="dot"></span> Site is live</div>
      <h1>E-TAKZIR</h1>
      <p>
        Your new project is ready and served locally over trusted HTTPS. Edit
        <code>index.html</code> to start building.
      </p>
      <div class="links">
        <a class="btn primary" href="/">Reload</a>
        <a class="btn" href="/info.php">PHP info</a>
      </div>
      <p class="hint">
        Created with EnvKit · this page lives at <code>index.html</code> in your
        project folder.
      </p>
    </main>
  </body>
</html>
